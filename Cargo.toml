[package]
name = "wideviner"
version = "0.3.0"
edition = "2021"
description = "Widevine CDM installer for Chromium and Firefox"
license = "MIT"
repository = "https://github.com/denizomer10/wideviner"
default-run = "wideviner"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
lzma-rs = "0.3"
tar = "0.4"
zip = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
anyhow = "1"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 2
strip = true
